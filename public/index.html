<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EW WebView Test</title>
    <script>
        window.addEventListener('message', (event) => {
            let message = event.data;
            handleEventFromParent(message)
        });

        function handleEventFromParent(message){
            let json = JSON.parse(message)
            switch (json.method) {
                case 'openCamera':
                    document.getElementById('image-response').setAttribute('src', json.data.image)
                    break;
                case 'openPhotoLibrary':
                    document.getElementById('image-response').setAttribute('src', json.data.image)
                    break;
                case 'getPictAndTitle':
                    document.getElementById('image-response').setAttribute('src', json.data.pict)
                    document.getElementById('ew-response').innerHTML = json.data.title
                    break;
                default:
                    document.getElementById('ew-response').innerHTML = message
                    break;
            }
        }

        function onMessageReceived(message) {
            handleEventFromParent(message)
        }

        function postMessageWithData(data) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent) || /iPad|iPhone|iPod/.test(userAgent)) {
                EwWebViewChannel.postMessage(data)
            } else {
                window.parent.postMessage({
                    type: "EW_EVENT",
                    data: data
                }, "*")
            }
        }
        function notifyFlutter(method) {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(userAgent) || /iPad|iPhone|iPod/.test(userAgent)) {
                invokeMethod(method)
            } else {
                if (method === 'openNotificationSetting') {
                    alert(`${method} is not support for web`)
                } else {
                    window.parent.postMessage({
                        type: "EW_EVENT",
                        data: JSON.stringify({
                            'method': method,
                        })
                    }, "*")
                }
            }
        }

        function invokeMethod(methodName) {
            EwWebViewChannel.postMessage(JSON.stringify({
                'method': methodName,
            }))
        }

        function openChat() {
            let title = document.getElementById("title-for-open-chat").value
            postMessageWithData(
                JSON.stringify({
                    'method': 'openChat',
                    'arguments': {
                        'title': title,
                    }
                })
            )
        }

        

        function openWebView() {
            postMessageWithData(
                JSON.stringify({
                    'method': 'openWebView',
                    'arguments': {
                        'url': 'https://google.com/',
                    }
                })
            )
        }

        function openEmailEditor() {
            postMessageWithData(JSON.stringify({
            'method': 'openEmailEditor',
            'arguments': {
                'to': 'example-receiver@gmail.com',
                'subject': 'Example subject',
                'body': 'Example body.',
                'cc': 'example1@gmail.com, example2@gmail.com',
                'bcc': 'example11@gmail.com, example12@gmail.com',
            }
            }))
        }

        function callPhone() {
            postMessageWithData(JSON.stringify({
                'method': 'callPhone',
                'arguments': {
                    'phone_number': '0123456789',
                }
            }))
        }

        function getPictAndTitle() {
            postMessageWithData(JSON.stringify({
                'method': 'getPictAndTitle',
                'arguments': {
                    'size': 16,
                }
            }))
        }
    </script>
</head>

<body>
    <div>&nbsp</div>
    <div>&nbsp</div>
    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openNavigationDrawer')">openNavigationDrawer</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="openChat()">openChat</button>
        <input id="title-for-open-chat" type="text" placeholder="Specify title here">
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('listChat')">listChat</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="openWebView()">openWebView</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="openEmailEditor()">openEmailEditor</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="callPhone()">callPhone</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('getGeoLocation')">getGeoLocation</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openCamera')">openCamera</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openPhotoLibrary')">openPhotoLibrary</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openShare')">openShare</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openNotificationSetting')">openNotificationSetting</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="getPictAndTitle()">getPictAndTitle</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('openTextInputHistory')">openTextInputHistory</button>
    </div>

    <div>&nbsp</div>
    <div>
        <button onclick="notifyFlutter('getScreen')">getScreen</button>
    </div>

    <div>&nbsp</div>
    <div id="ew-response"></div>

    <div>&nbsp</div>
    <img id="image-response"></img>
</body>

</html>
